<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator APHB Kab. Badung</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [luasTanah, setLuasTanah] = useState(200);
      const [njop, setNjop] = useState(1500000);
      const [noptkp, setNoptkp] = useState(300000000);

      const [pihak, setPihak] = useState([
        { id: 1, nama: 'Ahli Waris A (Penerima Utuh)', hakAwal: 25, hakAkhir: 100, kompensasi: 0 },
        { id: 2, nama: 'Ahli Waris B (Pelepas Hak)', hakAwal: 25, hakAkhir: 0, kompensasi: 50000000 },
        { id: 3, nama: 'Ahli Waris C (Pelepas Hak)', hakAwal: 25, hakAkhir: 0, kompensasi: 50000000 },
        { id: 4, nama: 'Ahli Waris D (Pelepas Hak)', hakAwal: 25, hakAkhir: 0, kompensasi: 50000000 },
      ]);

      const totalNjop = (parseFloat(luasTanah) || 0) * (parseFloat(njop) || 0);

      const updatePihak = (id, field, value) => {
        setPihak(pihak.map(p => p.id === id ? { ...p, [field]: value } : p));
      };

      const tambahPihak = () => {
        const newId = pihak.length > 0 ? Math.max(...pihak.map(p => p.id)) + 1 : 1;
        setPihak([...pihak, { id: newId, nama: `Ahli Waris ${newId}`, hakAwal: 0, hakAkhir: 0, kompensasi: 0 }]);
      };

      const hapusPihak = (id) => {
        if (pihak.length > 1) {
          setPihak(pihak.filter(p => p.id !== id));
        }
      };

      const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka || 0);
      };

      return (
        <div class="max-w-6xl mx-auto space-y-6">
          {/* Header */}
          <div class="bg-emerald-700 text-white p-6 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h1 class="text-2xl font-bold">Kalkulator & Analisis APHB</h1>
              <p class="text-emerald-100 text-sm mt-1">Sesuai Perda Kabupaten Badung No. 7 Tahun 2023 (NOPTKP Waris/APHB Rp 300.000.000)</p>
            </div>
            <button 
              onClick={() => window.print()} 
              class="bg-orange-500 hover:bg-orange-600 text-white font-medium px-4 py-2 rounded-xl text-sm transition-colors shadow print:hidden"
            >
              Cetak / Save PDF
            </button>
          </div>

          {/* Parameter Objek Pajak */}
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Luas Tanah Total (m²)</label>
              <input 
                type="number" 
                value={luasTanah} 
                onChange={(e) => setLuasTanah(e.target.value)}
                class="w-full border border-slate-300 p-2.5 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">NJOP per m² (Rp)</label>
              <input 
                type="number" 
                value={njop} 
                onChange={(e) => setNjop(e.target.value)}
                class="w-full border border-slate-300 p-2.5 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Nilai NJOP</label>
              <div class="p-2.5 bg-slate-100 rounded-xl font-bold text-slate-700 border border-slate-200">
                {formatRupiah(totalNjop)}
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">NOPTKP Waris/APHB Badung</label>
              <input 
                type="number" 
                value={noptkp} 
                onChange={(e) => setNoptkp(e.target.value)}
                class="w-full border border-slate-300 p-2.5 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-emerald-50 font-semibold text-emerald-800"
              />
            </div>
          </div>

          {/* Tabel Pembagian & Pajak */}
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
              <h2 class="font-bold text-slate-700">Rincian Hak & Kewajiban Pajak Per-Pihak</h2>
              <button 
                onClick={tambahPihak} 
                class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition-colors print:hidden"
              >
                + Tambah Pihak
              </button>
            </div>
            <table class="w-full text-left text-sm border-collapse">
              <thead>
                <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                  <th class="p-3 border-b">Nama Pihak</th>
                  <th class="p-3 border-b w-20">Awal %</th>
                  <th class="p-3 border-b w-20">Akhir %</th>
                  <th class="p-3 border-b">Luas Awal</th>
                  <th class="p-3 border-b">Luas Akhir</th>
                  <th class="p-3 border-b">Nilai Perolehan</th>
                  <th class="p-3 border-b">BPHTB (5%)</th>
                  <th class="p-3 border-b">Kompensasi (Rp)</th>
                  <th class="p-3 border-b">PPh (2.5%)</th>
                  <th class="p-3 border-b w-12 print:hidden"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                {pihak.map((p) => {
                  const luasAwal = (luasTanah * (p.hakAwal || 0)) / 100;
                  const luasAkhir = (luasTanah * (p.hakAkhir || 0)) / 100;
                  const selisihHak = p.hakAkhir - p.hakAwal;
                  const nilaiPerolehan = totalNjop * (selisihHak / 100);
                  
                  // Perhitungan BPHTB Badung
                  const dasarBphtb = Math.max(0, nilaiPerolehan - noptkp);
                  const bphtb = dasarBphtb * 0.05;

                  // PPh Final atas kompensasi
                  const pph = (p.kompensasi || 0) * 0.025;

                  return (
                    <tr key={p.id} class="hover:bg-slate-50">
                      <td class="p-3">
                        <input 
                          type="text" 
                          value={p.nama} 
                          onChange={(e) => updatePihak(p.id, 'nama', e.target.value)}
                          class="w-full border border-slate-200 p-1.5 rounded focus:ring-1 focus:ring-emerald-500"
                        />
                      </td>
                      <td class="p-3">
                        <input 
                          type="number" 
                          value={p.hakAwal} 
                          onChange={(e) => updatePihak(p.id, 'hakAwal', parseFloat(e.target.value) || 0)}
                          class="w-16 border border-slate-200 p-1.5 rounded text-center"
                        />
                      </td>
                      <td class="p-3">
                        <input 
                          type="number" 
                          value={p.hakAkhir} 
                          onChange={(e) => updatePihak(p.id, 'hakAkhir', parseFloat(e.target.value) || 0)}
                          class="w-16 border border-slate-200 p-1.5 rounded text-center font-semibold"
                        />
                      </td>
                      <td class="p-3 text-slate-600">{luasAwal.toFixed(1)} m²</td>
                      <td class="p-3 font-semibold text-emerald-700">{luasAkhir.toFixed(1)} m²</td>
                      <td class="p-3">{formatRupiah(nilaiPerolehan > 0 ? nilaiPerolehan : 0)}</td>
                      <td class="p-3 font-semibold text-rose-600">{formatRupiah(bphtb)}</td>
                      <td class="p-3">
                        <input 
                          type="number" 
                          value={p.kompensasi} 
                          onChange={(e) => updatePihak(p.id, 'kompensasi', parseFloat(e.target.value) || 0)}
                          class="w-28 border border-slate-200 p-1.5 rounded"
                        />
                      </td>
                      <td class="p-3 text-slate-700">{formatRupiah(pph)}</td>
                      <td class="p-3 print:hidden">
                        <button 
                          onClick={() => hapusPihak(p.id)} 
                          class="text-slate-400 hover:text-rose-500 font-bold px-2"
                        >
                          ✕
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
